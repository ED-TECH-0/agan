[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agan"
version = "0.1.0-dev"
description = "AGAN — Local AI that researches, verifies, learns skills, and adapts"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "httpx>=0.27",
    "trafilatura>=1.9",
    "numpy>=1.26",
    "aiofiles>=23.0",
    "typer>=0.12",
    "rich>=13.0",
    "datasets>=2.19",
    "onnxruntime>=1.18",
    "sentence-transformers>=2.2",
    "shellingham>=1.5",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "transformers>=4.30",
]
gpu = ["GPUtil>=1.4"]
vector = ["faiss-cpu>=1.7"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
